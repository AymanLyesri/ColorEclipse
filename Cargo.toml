[package]
name = "coloreclipse"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "coloreclipse"
path = "src/main.rs"

# Color generation is internal (image crate); only runtime tools are
# gsettings/notify-send/hyprctl/ffmpeg, so the binary needs the toolchain to build.
[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
